# EPGArr inside the container: PHP pages, plus the guide files and logos from /data.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /app/www;
    index index.php;
    client_max_body_size 8m;

    # Nothing starting with a dot (.git, .ht*) is ever served.
    location ~ /\. { deny all; return 404; }

    # Guide files: media servers fetch these directly, no login.
    location /guides/ {
        types { application/xml xml; application/gzip gz; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /logos/ {
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }
}
