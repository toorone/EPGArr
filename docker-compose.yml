# EPGArr: docker compose up -d --build
# Then open http://<server>:8080 and create your account.
services:
  epgarr:
    build: .
    image: epgarr:latest
    container_name: epgarr
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=America/New_York
    volumes:
      - ./data:/data
