# Build check: runs on every push and pull request. A red X on GitHub means
# the program does not compile, a test failed, or the Docker image does not build.
# A push to main also publishes the image as ghcr.io/toorone/epgarr:latest (and
# :<version>), and makes a GitHub release for each CHANGELOG.md version that has none.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  program:
    name: Program (cargo build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epg-loader
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: epg-loader
      - name: Build
        run: cargo build --release --locked
      - name: Tests
        run: cargo test --release --locked

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: program
    # Pushes to main publish ghcr.io/toorone/epgarr:latest; other branches only build.
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version' epg-loader/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build the image for a test run
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: epgarr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test run (starts, serves the pages, runs as PUID:PGID, writes the log)
        run: |
          # Failures are reported as annotations, so they show without signing in.
          fail() {
            echo "::error::$1"
            docker logs epgtest 2>&1 | tail -25 | while IFS= read -r l; do echo "::error::log: $l"; done
            exit 1
          }
          mkdir -p data
          out=$(docker run -d --name epgtest -p 8080:80 -e PUID=1234 -e PGID=1234 -v "$PWD/data:/data" epgarr:test 2>&1) || fail "docker run failed: $out | images: $(docker images --format '{{.Repository}}:{{.Tag}}' | tr -s '[:space:]' ' ')"
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Create your account" || fail "the first page did not show Create your account"
          sleep 2
          test "$(stat -c %u:%g data)" = "1234:1234" || fail "data is owned by $(stat -c %u:%g data), not 1234:1234"
          test "$(stat -c %u data/epg.db)" = "1234" || fail "epg.db is owned by $(stat -c %u data/epg.db)"
          docker top epgtest -eo uid,comm | grep -qE '^ *1234 +epg-loader' || fail "epg-loader is not running as 1234: $(docker top epgtest -eo uid,comm | tr -s '[:space:]' ' ')"
          grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:]{8}  EPGArr pages on' data/logs/epgarr.log || fail "logs/epgarr.log has no time-stamped start line: $(head -c 300 data/logs/epgarr.log 2>&1)"
          docker logs epgtest 2>&1 | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:]{8}  EPGArr pages on' || fail "docker logs has no time-stamped start line"
          docker stop -t 15 epgtest
          docker logs epgtest 2>&1 | tail -5
      - name: Build (and on main, publish) the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/toorone/epgarr:latest
            ghcr.io/toorone/epgarr:${{ steps.v.outputs.version }}
            ghcr.io/toorone/epgarr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Make releases from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(grep -m1 '^version' epg-loader/Cargo.toml | cut -d'"' -f2)
          # Every "## X.Y.Z - date: title" heading, oldest first.
          grep -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | tac | while read -r line; do
            v=$(echo "$line" | awk '{print $2}')
            tag="v$v"
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            # The section's text: from its heading to the next one.
            awk -v h="$line" '$0 == h {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
            title="EPGArr ${line#\#\# }"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              latest=$([ "$v" = "$current" ] && echo true || echo false)
              gh release create "$tag" --verify-tag --title "$title" --notes-file notes.md --latest="$latest"
            elif [ "$v" = "$current" ]; then
              gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
            else
              echo "No tag for $tag: skipped"
            fi
          done
