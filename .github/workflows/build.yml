# Build check: runs on every push and pull request. A red X on GitHub means
# the program does not compile, a test failed, or the Docker image does not build.
# A push to main also publishes the image as ghcr.io/toorone/epgarr:latest.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  program:
    name: Program (cargo build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epg-loader
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: epg-loader
      - name: Build
        run: cargo build --release --locked
      - name: Tests
        run: cargo test --release --locked

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: program
    # Pushes to main publish ghcr.io/toorone/epgarr:latest; other branches only build.
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and on main, publish) the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/toorone/epgarr:latest
            ghcr.io/toorone/epgarr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
