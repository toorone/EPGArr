# Build check: runs on every push and pull request. A red X on GitHub means
# the program does not compile, a test failed, or the Docker image does not build.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  program:
    name: Program (cargo build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epg-loader
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: epg-loader
      - name: Build
        run: cargo build --release --locked
      - name: Tests
        run: cargo test --release --locked

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: program
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: epgarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
