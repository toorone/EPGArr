# Build check: runs on every push and pull request. A red X on GitHub means
# the program does not compile, a test failed, or the Docker image does not build.
# A push to main also publishes the image as ghcr.io/toorone/epgarr:latest (and
# :<version>), and makes a GitHub release for each CHANGELOG.md version that has none.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  program:
    name: Program (cargo build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epg-loader
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: epg-loader
      - name: Build
        run: cargo build --release --locked
      - name: Tests
        run: cargo test --release --locked

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: program
    # Pushes to main publish ghcr.io/toorone/epgarr:latest; other branches only build.
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=$(grep -m1 '^version' epg-loader/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Build (and on main, publish) the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/toorone/epgarr:latest
            ghcr.io/toorone/epgarr:${{ steps.v.outputs.version }}
            ghcr.io/toorone/epgarr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Make releases from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(grep -m1 '^version' epg-loader/Cargo.toml | cut -d'"' -f2)
          # Every "## X.Y.Z - date: title" heading, oldest first.
          grep -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | tac | while read -r line; do
            v=$(echo "$line" | awk '{print $2}')
            tag="v$v"
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            # The section's text: from its heading to the next one.
            awk -v h="$line" '$0 == h {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
            title="EPGArr ${line#\#\# }"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              latest=$([ "$v" = "$current" ] && echo true || echo false)
              gh release create "$tag" --verify-tag --title "$title" --notes-file notes.md --latest="$latest"
            elif [ "$v" = "$current" ]; then
              gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
            else
              echo "No tag for $tag: skipped"
            fi
          done
